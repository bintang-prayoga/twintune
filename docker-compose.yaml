services:
  elysia-backend:
    build: 
      context: ./backend
    ports:
      - "3000:3000"
    environment:
      # This points to the Python container's internal DNS name and port
      - PYTHON_ENGINE_URL=http://python-engine:8000
    depends_on:
      - python-engine

  python-engine:
    build: 
      context: ./engine
    ports:
      - "8000:8000"